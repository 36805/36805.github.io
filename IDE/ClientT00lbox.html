<!DOCTYPE html>
<html>
<head>
    <title>ROBLOX Zoom Control</title>
    <script>
function zoom() {
    var RBXApp = new ActiveXObject("Roblox.App");
    RBXApp.ToggleZoom(window);
}
    </script>
</head>
<body>
    <button onclick="zoom()">Toggle Zoom</button>
    <button onclick="zoom()">Zoom Again</button>
</body>
</html>
